.choix{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 14px}.choix .btn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px 16px;text-align:left;height:auto}.choix .btn small{font-weight:400;opacity:.85;font-size:12.5px}@media(max-width:480px){.choix{grid-template-columns:1fr}}
.pz-video{display:grid;grid-template-columns:1.6fr 1fr;gap:28px;align-items:center;margin-top:18px}.pz-video video{width:100%;border-radius:14px;box-shadow:0 12px 34px rgba(19,35,58,.18);background:#13233a;aspect-ratio:16/9}.pz-guide{display:flex;flex-direction:column;gap:10px;align-items:flex-start}.pz-guide p{margin:0}@media(max-width:820px){.pz-video{grid-template-columns:1fr}}
.langbtn.ctc{display:inline-flex;align-items:center;gap:6px;text-decoration:none;min-height:32px}.langbtn.ctc span[aria-hidden]{font-size:14px;line-height:1}a.btn{text-decoration:none}
@media(max-width:700px){.langbtn.ctc .lbl{display:none}.langbtn.ctc{padding:6px 9px}}
#main.verif>*{filter:blur(6px);opacity:.4;pointer-events:none;user-select:none}.paywall h2{margin-top:0}.paywall .tw{max-width:520px}

.pz-regs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin:18px 0 20px}
.pz-reg{display:block;background:#fff;border:1px solid #e6e1d6;border-radius:12px;padding:14px 16px;text-decoration:none;color:#13233a}
.pz-reg:hover{border-color:#c9962e}.pz-reg small{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#8a6414;font-weight:700}.pz-reg b{display:block;margin-top:4px;font-size:15px;line-height:1.35}
.pwdreq{text-transform:none;letter-spacing:0;display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:12px;font-weight:400}.pwdreq i{font-style:normal;color:#8a3b2e}.pwdreq i.ok{color:#0f7a55}
.langbtn.inscbtn{background:transparent;border:1px solid #e0b04c;color:#e0b04c;font-weight:600}.langbtn.inscbtn:hover{background:#e0b04c;color:#13233a}
.etapes{display:flex;gap:8px;list-style:none;padding:0;margin:4px 0 12px;counter-reset:et;font-size:13px}.etapes li{counter-increment:et;padding:5px 12px;border-radius:999px;background:#eef1f5;color:#566275}
.etapes li::before{content:counter(et) ". "}.etapes li.on{background:#13233a;color:#fff;font-weight:600}.etapes li.fait{background:#e3f3ec;color:#0f7a55}.etapes li.fait::before{content:"✓ "}
.warnc{color:#8a5a00}
.mfa-qr{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;margin-top:14px;padding:14px;border:1px solid #e6e1d6;border-radius:12px;background:#fff}.mfa-qr img{border:1px solid #e6e1d6;border-radius:8px;background:#fff}.mfa-qr code{display:inline-block;margin-top:4px;padding:4px 8px;background:#f3f1ec;border-radius:6px;letter-spacing:.08em;word-break:break-all}
.card.mfa{max-width:560px;margin:30px auto}#mfacode,#mfaecode{font-size:22px;letter-spacing:.3em;text-align:center;max-width:200px}
.pz-secu{font-size:13px;opacity:.85;margin:0 0 6px}
.aud-bars{display:flex;align-items:flex-end;gap:2px;height:120px;margin:16px 0;padding:6px;border-bottom:1px solid #e6e1d6}.aud-bars span{flex:1;background:#c9962e;border-radius:3px 3px 0 0;min-width:2px}.aud-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}.aud-grid table{width:100%}
@media (max-width:520px){#regbtn,#ctcbtn,#mailbtn{display:none!important}.pz-hero h1{font-size:30px;line-height:1.15}.pz-hero .pz-lead{font-size:15px;margin:10px 0 14px}.pz-hero .pz-tag{font-size:12px}}
.demobar{background:#fdf5e6;border:1px solid #f0d9a8;color:#5c3d06;border-radius:12px;padding:10px 14px;margin:0 0 16px;font-size:14px}body.visitor .demobar{max-width:1200px;margin:16px auto}</style>
